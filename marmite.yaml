name: Magneira
tagline: Engenharia de software, tecnologia e inteligência artificial
url: https://magneira.com.br
footer: "Magneira — Magno Carvalho dos Santos"

logo_image: static/brand/magneira-logo-horizontal.svg

pagination: 10
toc: false
json_feed: true
enable_search: true
search_show_matches: true

menu:
  - ["Sobre", "about.html"]
  - ["Projetos", "projects.html"]
  - ["Blog", "archive.html"]
  - ["Contato", "contato.html"]

default_author: magno
authors:
  magno:
    name: Magno Carvalho dos Santos
    avatar: https://github.com/magnocarvalho.png
    bio: Engenheiro de software e líder de tecnologia. Fundador da Magneira.
    links:
      - ["GitHub", "https://github.com/magnocarvalho"]
      - ["LinkedIn", "https://www.linkedin.com/in/magnocarv"]

file_mapping:
  - source: static/CNAME
    dest: CNAME
  - source: brand/favicon.ico
    dest: favicon.ico
  - source: brand/favicon.ico
    dest: static/favicon.ico

