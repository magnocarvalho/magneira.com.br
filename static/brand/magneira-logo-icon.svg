<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Magneira Consultoria — Ícone</title>
  <desc>Versão ícone editável do símbolo da Magneira Consultoria.</desc>

  
    <g id="icon-symbol" transform="translate(20,70) scale(0.92)">
      <defs>
        <linearGradient id="icon-symbol-grad-left" x1="110" y1="150" x2="400" y2="360" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0B3D91"/>
          <stop offset="100%" stop-color="#0E5F78"/>
        </linearGradient>
        <linearGradient id="icon-symbol-grad-swoosh" x1="220" y1="450" x2="715" y2="140" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0B3D91"/>
          <stop offset="52%" stop-color="#0E5F78"/>
          <stop offset="100%" stop-color="#17B6C6"/>
        </linearGradient>
        <linearGradient id="icon-symbol-grad-right" x1="620" y1="650" x2="710" y2="265" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0E5F78"/>
          <stop offset="100%" stop-color="#17B6C6"/>
        </linearGradient>
        <linearGradient id="icon-symbol-grad-bar1" x1="430" y1="650" x2="490" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#C5D0D8"/>
          <stop offset="100%" stop-color="#A7B2BF"/>
        </linearGradient>
        <linearGradient id="icon-symbol-grad-bar2" x1="510" y1="650" x2="576" y2="380" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#A8B4C0"/>
          <stop offset="100%" stop-color="#8E9CAA"/>
        </linearGradient>
      </defs>

      <!-- left base -->
      <rect x="110" y="300" width="140" height="350" rx="18" fill="#0B3D91"/>

      <!-- left upper block -->
      <path d="M110 185
               Q110 150 145 150
               Q188 150 220 172
               L395 307
               Q347 356 299 377
               Q223 411 160 378
               L110 325 Z"
            fill="url(#icon-symbol-grad-left)"/>

      <!-- central rising ribbon -->
      <path d="M225 379
               C308 468 406 500 525 370
               L715 220
               L715 140
               L540 266
               C430 346 361 421 305 442
               C266 457 236 446 205 420 Z"
            fill="url(#icon-symbol-grad-swoosh)"/>

      <!-- right growth bars -->
      <path d="M430 495 L490 450 L490 650 L430 650 Z" fill="url(#icon-symbol-grad-bar1)"/>
      <path d="M510 432 L576 382 L576 650 L510 650 Z" fill="url(#icon-symbol-grad-bar2)"/>
      <path d="M620 330 L710 265 L710 650 Q710 668 692 668 L638 668 Q620 668 620 650 Z" fill="url(#icon-symbol-grad-right)"/>
    </g>
    
</svg>
